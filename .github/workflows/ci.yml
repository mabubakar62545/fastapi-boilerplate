name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FASTAPI_ENV: development
  PROJECT_NAME: "FastAPI Boilerplate"
  SECRET_KEY: ci-only-secret-key
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-only-password
  POSTGRES_PASSWORD: ci-only-password
  DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run bash scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run python app/backend_pre_start.py
      - run: uv run alembic upgrade head
      - run: uv run bash scripts/tests-start.sh
